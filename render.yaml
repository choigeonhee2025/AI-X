services:
  - type: web
    name: lunchbreak-recommender
    env: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATA_GO_KR_API_KEY
        sync: false
      - key: KAKAO_JS_KEY
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: ADMIN_USERNAMES
        sync: false
