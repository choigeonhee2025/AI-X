<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>공강 밥집 추천</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#ff6b35" />
  <link rel="icon" href="/icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
</head>
<body>
  <main class="wrap">
    <div class="top-bar">
      <span id="whoami" class="hint"></span>
      <button type="button" id="logoutBtn" class="text-btn">로그아웃</button>
    </div>

    <header class="hero">
      <div class="hero-badge">🍱</div>
      <h1>공강 시간, 밥집 추천</h1>
      <p class="sub">공강 시간·식사 시간·먹고 싶은 음식을 알려주면<br />왕복해서 수업에 늦지 않을 식당만 골라드려요.</p>
    </header>

    <form id="form" class="card form-card">
      <div class="field">
        <label for="breakMinutes">공강 시간</label>
        <div class="input-unit">
          <input type="number" id="breakMinutes" min="1" value="60" required />
          <span>분</span>
        </div>
      </div>

      <div class="field">
        <label for="mealMinutes">식사 시간</label>
        <div class="input-unit">
          <input type="number" id="mealMinutes" min="1" value="20" required />
          <span>분</span>
        </div>
      </div>

      <div class="field">
        <label>먹고 싶은 음식</label>
        <div id="categoryPills" class="pills"></div>
      </div>

      <div class="field">
        <label>출발 위치</label>
        <button type="button" id="locateBtn" class="ghost-btn">
          <span class="pin">📍</span>
          <span id="locateBtnText">현재 위치 가져오기</span>
        </button>
        <div class="place-search">
          <input type="text" id="originSearchInput" placeholder="또는 강의동 이름으로 검색 (예: 공학관)" />
          <div id="originSearchResults" class="place-search-results hidden"></div>
        </div>
        <p id="locationStatus" class="hint">버튼을 눌러 지금 위치를 알려주거나, 강의동을 검색하세요.</p>
      </div>

      <div class="field">
        <label>도착 위치 (다음 수업 강의동, 선택)</label>
        <div class="place-search">
          <input type="text" id="destSearchInput" placeholder="비워두면 출발 위치로 돌아오는 걸로 계산해요" />
          <div id="destSearchResults" class="place-search-results hidden"></div>
        </div>
        <p id="destStatus" class="hint"></p>
      </div>

      <button type="submit" id="submitBtn" class="primary-btn" disabled>
        <span id="submitBtnText">추천받기</span>
      </button>
    </form>

    <p id="modelNotice" class="notice"></p>

    <div class="results-toolbar">
      <button type="button" id="randomPickBtn" class="random-pick-btn hidden">🎲 오늘은 여기! 랜덤 추천</button>
      <button type="button" id="favOnlyToggleBtn" class="fav-only-btn hidden">⭐ 즐겨찾기만</button>
    </div>

    <section id="results"></section>

    <footer class="foot">
      <a href="/mypage">내 통계 보기 →</a>
      <br />
      <a href="/collect">이동시간 데이터 수집하러 가기 →</a>
      <br />
      <a href="/restaurants">실제 음식점 추가/관리 →</a>
    </footer>
  </main>

  <div id="mapModal" class="map-modal hidden">
    <div class="map-modal-inner">
      <div class="map-modal-header">
        <span id="mapModalTitle" class="map-modal-title"></span>
        <button type="button" id="mapModalClose" class="text-btn">닫기 ✕</button>
      </div>
      <div id="mapContainer" class="map-container"></div>
      <p id="mapModalSummary" class="hint map-modal-summary"></p>
    </div>
  </div>

  <div id="reportModal" class="map-modal hidden">
    <div class="map-modal-inner">
      <div class="map-modal-header">
        <span id="reportModalTitle" class="map-modal-title">🚩 정보 신고</span>
        <button type="button" id="reportModalClose" class="text-btn">닫기 ✕</button>
      </div>
      <div class="field">
        <label>뭐가 잘못됐나요?</label>
        <select id="reportReason">
          <option value="category">카테고리가 틀렸어요</option>
          <option value="location">위치가 틀렸어요</option>
          <option value="closed">폐업/없어진 곳이에요</option>
          <option value="duplicate">중복으로 등록됐어요</option>
          <option value="other">기타</option>
        </select>
      </div>
      <div class="field">
        <label>자세한 내용 (선택)</label>
        <textarea id="reportDetail" rows="3" placeholder="예: 여긴 중식당인데 한식으로 나와요"></textarea>
      </div>
      <button type="button" id="reportSubmitBtn" class="primary-btn">신고하기</button>
      <p id="reportModalMsg" class="hint"></p>
    </div>
  </div>

  <script src="js/place_search.js"></script>
  <script src="js/main.js"></script>
  <script src="js/map.js"></script>
  <script src="js/report.js"></script>
  <script src="js/share.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
